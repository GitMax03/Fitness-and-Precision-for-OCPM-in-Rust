[package]
name = "Fitness-and-Precision-for-OCPM"
version = "0.1.0"
edition = "2024"

[dependencies]
process_mining = { git = "https://github.com/aarkue/rust4pm.git", branch = "main", features = ["ocel-sqlite"] }
chrono = "0.4.41"

rustworkx-core = "0.16"
counter = { version = "0.6.0", features = ["serde"] }
uuid = { version = "1.16.0", features = ["v4"] }
bimap = "0.6"
petgraph = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = {version = "1.0.140", features = ["preserve_order"]}
ron = "0.8"
indicatif = {version = "0.17.11", optional = true}
rayon = "1.10.0"
multiset = "0.0.5"
multiset-hash = "0.2.0"
dashmap = "7.0.0-rc2"

[features]
progress = ["indicatif"]
progress-percentage = []
stats = []
save_stats = ["stats"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
